<svg width="100%" viewBox="0 0 680 580" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CocoMind architecture diagram</title>
<desc>A flowchart showing how CocoMind processes a creator's content idea through 5 steps using Microsoft 365 tools to produce episode plans, Excel calendar entries, and Outlook emails.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Creator input -->
<g>
  <rect x="220" y="20" width="240" height="52" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
  <text x="340" y="40" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Content creator</text>
  <text x="340" y="58" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-family:system-ui,sans-serif;font-size:12px;">"I want an episode about frogs"</text>
</g>

<!-- Arrow down -->
<line x1="340" y1="72" x2="340" y2="108" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- CocoMind agent — UPDATED LABEL -->
<g>
  <rect x="180" y="108" width="320" height="56" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
  <text x="340" y="128" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">CocoMind agent</text>
  <text x="340" y="148" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-family:system-ui,sans-serif;font-size:12px;">Microsoft Copilot Studio · Azure OpenAI · Foundry IQ</text>
</g>

<!-- Arrow down -->
<line x1="340" y1="164" x2="340" y2="200" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- Step boxes -->
<g>
  <rect x="30" y="200" width="118" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="89" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Step 1</text>
  <text x="89" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;">Episode concept</text>
</g>
<g>
  <rect x="162" y="200" width="118" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="221" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Step 2</text>
  <text x="221" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;">Script outline</text>
</g>
<g>
  <rect x="294" y="200" width="118" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="353" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Step 3</text>
  <text x="353" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;">Learning objectives</text>
</g>
<g>
  <rect x="426" y="200" width="118" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="485" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Step 4</text>
  <text x="485" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;">Content calendar</text>
</g>
<g>
  <rect x="558" y="200" width="92" height="56" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="604" y="220" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Step 5</text>
  <text x="604" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-family:system-ui,sans-serif;font-size:12px;">Parent email</text>
</g>

<!-- Connector lines -->
<line x1="340" y1="200" x2="89" y2="200" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" fill="none"/>
<line x1="340" y1="200" x2="604" y2="200" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" fill="none"/>

<!-- Arrows down from steps to tools -->
<line x1="89" y1="256" x2="89" y2="330" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="221" y1="256" x2="221" y2="330" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="353" y1="256" x2="353" y2="330" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="485" y1="256" x2="485" y2="330" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="604" y1="256" x2="604" y2="330" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- M365 tools label -->
<text x="340" y="320" text-anchor="middle" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">Microsoft 365 connected tools</text>

<!-- Tool boxes -->
<g>
  <rect x="30" y="330" width="250" height="52" rx="8" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px;"/>
  <text x="155" y="350" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12,68,124);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Copilot Studio reasoning</text>
  <text x="155" y="368" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24,95,165);font-family:system-ui,sans-serif;font-size:12px;">Steps 1, 2 &amp; 3 output in chat</text>
</g>
<g>
  <rect x="294" y="330" width="148" height="52" rx="8" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px;"/>
  <text x="368" y="350" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12,68,124);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Excel Online</text>
  <text x="368" y="368" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24,95,165);font-family:system-ui,sans-serif;font-size:12px;">Content calendar row</text>
</g>
<g>
  <rect x="456" y="330" width="194" height="52" rx="8" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px;"/>
  <text x="553" y="350" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12,68,124);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Outlook</text>
  <text x="553" y="368" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24,95,165);font-family:system-ui,sans-serif;font-size:12px;">Parent email draft</text>
</g>

<!-- Arrows down to outputs -->
<line x1="155" y1="382" x2="155" y2="440" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="368" y1="382" x2="368" y2="440" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>
<line x1="553" y1="382" x2="553" y2="440" marker-end="url(#arrow)" style="stroke:rgb(115,114,108);stroke-width:1.5px;fill:none;"/>

<!-- Output boxes -->
<g>
  <rect x="30" y="440" width="250" height="52" rx="8" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="155" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Episode plan</text>
  <text x="155" y="478" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-family:system-ui,sans-serif;font-size:12px;">Concept · script · objectives</text>
</g>
<g>
  <rect x="294" y="440" width="148" height="52" rx="8" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="368" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Publish date</text>
  <text x="368" y="478" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-family:system-ui,sans-serif;font-size:12px;">Logged to calendar</text>
</g>
<g>
  <rect x="456" y="440" width="194" height="52" rx="8" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="553" y="460" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-family:system-ui,sans-serif;font-size:14px;font-weight:500;">Parent email</text>
  <text x="553" y="478" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-family:system-ui,sans-serif;font-size:12px;">Ready to send in Outlook</text>
</g>

<!-- Time label -->
<text x="340" y="530" text-anchor="middle" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">Full workflow completes in under 5 minutes from a single prompt</text>

<!-- Legend -->
<rect x="30" y="550" width="12" height="12" rx="2" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
<text x="48" y="560" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">Creator</text>
<rect x="110" y="550" width="12" height="12" rx="2" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
<text x="128" y="560" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">AI agent</text>
<rect x="200" y="550" width="12" height="12" rx="2" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
<text x="218" y="560" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">Reasoning steps</text>
<rect x="320" y="550" width="12" height="12" rx="2" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px;"/>
<text x="338" y="560" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">M365 tools</text>
<rect x="416" y="550" width="12" height="12" rx="2" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
<text x="434" y="560" style="fill:rgb(61,61,58);font-family:system-ui,sans-serif;font-size:12px;">Outputs</text>

</svg>
